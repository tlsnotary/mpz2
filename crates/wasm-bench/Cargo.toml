[package]
name = "mpz-wasm-bench"
version = "0.1.0-beta.1"
edition = "2024"

[lints]
workspace = true

[features]
default = []
rayon = [
    "mpz-ot/rayon",
    "mpz-ot-core/rayon",
    "mpz-zk/rayon",
    "mpz-zk-core/rayon",
    "mpz-garble/rayon",
    "mpz-garble-core/rayon",
]

[dependencies]
mpz-garble-core = { workspace = true }
mpz-garble = { workspace = true }
mpz-zk-core = { workspace = true }
mpz-zk = { workspace = true }
pollster = { workspace = true }
mpz-circuits = { workspace = true, features = ["aes"] }
mpz-memory-core = { workspace = true }
mpz-core = { workspace = true }
mpz-common = { workspace = true, features = ["test-utils"] }
mpz-ot = { workspace = true, features = ["ideal"] }
mpz-ot-core = { workspace = true }
mpz-vm-core = { workspace = true }
blake3 = { workspace = true }

wasm-bindgen = { workspace = true }
wasm-bindgen-futures = { workspace = true }
js-sys = { workspace = true }
getrandom = { workspace = true, features = ["wasm_js"] }
rand = { workspace = true }
futures = { workspace = true }
web-spawn = { workspace = true, features = ["no-bundler"] }
rayon = { workspace = true }
web-sys = { workspace = true, features = [
    "console",
    "Window",
    "Performance",
    "Worker",
    "WorkerOptions",
    "WorkerType",
] }
serio = { workspace = true }
aes-wasm = { workspace = true }
aes = { workspace = true }

[dev-dependencies]
crossbeam-channel = "0.5"
wasm-bindgen-test = { workspace = true }

# Browser benches mirroring the native criterion crate layout. Each bench target
# shares its measurement body verbatim via `#[path]` with the corresponding
# native bench and is driven by wasm-bindgen-test's vendored criterion in a
# headless browser. See README.md for how to run them.

[[bench]]
name = "zk_prover"
path = "benches/zk/prover.rs"

[[bench]]
name = "zk_verifier"
path = "benches/zk/verifier.rs"

[[bench]]
name = "zk_core_prover"
path = "benches/zk-core/prover.rs"

[[bench]]
name = "zk_core_verifier"
path = "benches/zk-core/verifier.rs"

[[bench]]
name = "ot_ferret_sender"
path = "benches/ot/ferret/sender.rs"

[[bench]]
name = "ot_ferret_receiver"
path = "benches/ot/ferret/receiver.rs"

[[bench]]
name = "garble_garbler"
path = "benches/garble/garbler.rs"

[[bench]]
name = "garble_evaluator"
path = "benches/garble/evaluator.rs"

[[bench]]
name = "garble_core_garble"
path = "benches/garble-core/garble.rs"

[[bench]]
name = "garble_core_evaluate"
path = "benches/garble-core/evaluate.rs"
