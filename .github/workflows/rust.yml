name: Rust

on:
  push:
    branches: [dev]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:

  build_and_test:
    name: "Build and Test"
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust Stable
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable

      - uses: Swatinem/rust-cache@v2.7.7

      - name: "Test"
        # Run all tests (bins, examples, lib, integration and docs)
        # https://doc.rust-lang.org/cargo/commands/cargo-test.html#target-selection
        run: cargo test

      - name: "Check documentation"
        # env:
        #   RUSTDOCFLAGS: -D warnings
        run: cargo doc --no-deps --workspace --lib --document-private-items --examples

  rustfmt_and_clippy:
    name: Rustfmt and Clippy
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      # Nightly is required: .rustfmt.toml uses unstable options, and clippy
      # with --all-features builds matrix-transpose's simd-transpose feature,
      # which needs the nightly-only portable_simd language feature.
      - name: Install Rust Nightly with rustfmt and clippy
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: nightly
          components: rustfmt, clippy, rust-src
          targets: wasm32-unknown-unknown

      - uses: Swatinem/rust-cache@v2.7.7

      - name: "Check formatting"
        run: cargo +nightly fmt --check --all

      - name: Run Clippy
        run: cargo +nightly clippy --workspace --exclude mpz-wasm-bench --all-targets --all-features -- -D warnings

      # `--all-features` selects the MT benches; the `{}` configuration is
      # covered by the no-default-features lane below.
      - name: Run Clippy on wasm-bench
        working-directory: crates/wasm-bench
        run: cargo +nightly clippy --benches --all-features -- -D warnings

  clippy_no_default:
    name: "Clippy (no default features)"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # mpz-wasm-bench is included here too, so this lane needs the wasm target
      # and rust-src (`-Zbuild-std`).
      - name: Install Rust Nightly with clippy
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: nightly
          components: clippy, rust-src
          targets: wasm32-unknown-unknown

      - uses: Swatinem/rust-cache@v2.7.7
        with:
          # Own entry: this job builds a different feature set than the lint
          # job, and sharing a key would make the two overwrite each other.
          key: clippy-no-default

      # Covers the cfg(not(feature = "...")) branches that --all-features can
      # never compile. One cargo invocation per crate: features are unified
      # across packages selected together, so a single minimal build does not
      # exist for the workspace.
      - name: Run Clippy with no default features
        run: ./scripts/ci/clippy-no-default.sh

  wasm:
    name: "Build WASM benches"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust Nightly with rust-src
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: nightly
          targets: wasm32-unknown-unknown
          components: rust-src

      - uses: Swatinem/rust-cache@v2.7.7

      # Compiles every browser bench for wasm32 (atomics/SIMD/shared-memory
      # flags from crates/wasm-bench/.cargo/config.toml). Executing them needs a
      # headless browser plus a version-matched wasm-bindgen-test-runner, so the
      # suite is not run here; see crates/wasm-bench/README.md.
      - name: Build wasm benches
        working-directory: crates/wasm-bench
        run: cargo +nightly build --benches

  changes:
    name: "Detect Miri-relevant changes"
    runs-on: ubuntu-latest
    outputs:
      miri: ${{ steps.detect.outputs.miri }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # PRs diff against the base commit, pushes against the previous tip.
      # An empty or unknown base makes the script report true, i.e. run Miri.
      - id: detect
        env:
          BASE_REV: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: echo "miri=$(./scripts/ci/miri-changed.sh "$BASE_REV")" >> "$GITHUB_OUTPUT"

  miri:
    needs: changes
    if: "(github.event_name == 'workflow_dispatch' || needs.changes.outputs.miri == 'true') && ! github.event.pull_request.draft"
    name: "Test with Miri"
    runs-on: ubuntu-latest
    env:
      # blake3's build.rs cross-compiles NEON asm for aarch64, which requires
      # a C cross-compiler the runner doesn't have. Miri can't meaningfully
      # interpret the asm anyway, so force the pure-Rust path by setting the
      # env var blake3 probes for its `no_neon` cargo feature.
      CARGO_FEATURE_NO_NEON: "1"
    steps:
      - uses: actions/checkout@v4

      # The `alloca` crate (a dev-dependency pulled in via criterion) has a
      # build script that cross-compiles C, which needs an aarch64 C compiler
      # for the aarch64 Miri target.
      - name: Install aarch64 cross compiler
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu

      - name: Install Miri
        run: |
          rustup toolchain install nightly --component miri
          rustup override set nightly
          cargo miri setup

      - name: Test with Miri on x86_64
        run: cargo miri test -p clmul -p matrix-transpose -p mpz-fields --target x86_64-unknown-linux-gnu

      - name: Test with Miri on aarch64
        run: cargo miri test -p clmul -p matrix-transpose -p mpz-fields --target aarch64-unknown-linux-gnu